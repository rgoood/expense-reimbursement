[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-reimbursement"
version = "0.1.0"
description = "Upload a receipt image, auto-extract the content, and generate A5 PDF reimbursement form + receipt."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "rgoood" }]
requires-python = ">=3.10"
keywords = ["expense", "reimbursement", "ocr", "pdf", "a5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "reportlab>=4.1",
    "Pillow>=10.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3"]
web = ["Flask>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
    "types-reportlab>=4.5",
    "PyPDF>=4.0",
]

[project.scripts]
expense-reimbursement = "expense_reimbursement.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expense_reimbursement = ["py.typed", "templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pytesseract", "PIL.*"]
ignore_missing_imports = true
